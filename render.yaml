services:
  - type: web
    name: xgrid-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SITE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: API_PUBLIC_URL
        sync: false
      # Optional: mount a Render Persistent Disk to /var/data and set:
      # - key: DATA_DIR
      #   value: /var/data
      # - key: UPLOAD_DIR
      #   value: /var/data/uploads/blogs
